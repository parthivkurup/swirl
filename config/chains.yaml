# Melbourne frozen yoghurt businesses
# Compiled 2026-08-04 from live web sources (official sites, centre directories,
# Instagram/TikTok bios, delivery platform listings).
# null = could not verify from a source found in this research pass.
#
# footprint: does the MONITORED ACCOUNT announce deals for stores outside
# GREATER MELBOURNE? Not "is the company national" - what matters is whether a
# caption from this account can be about somewhere we do not serve.
#   melbourne_only - every venue is in Greater Melbourne, so a caption that
#                    names no city means Melbourne.
#   national       - it announces for stores elsewhere, so a caption that names
#                    no city means genuinely unknown and must not be published
#                    as a Melbourne deal.
#   unknown        - not established. Treated exactly like national (the safe
#                    side), never guessed at.
# Greater Melbourne, not Victoria: Geelong is VIC and is NOT melbourne_only.
# Read by ingest.postprocess.derive_scope via the chains table; re-seed after
# editing (python -m db.seed) and re-derive if you change a value.
chains:
  # ---------------------------------------------------------------
  # Self-serve chains with multiple Melbourne locations
  # ---------------------------------------------------------------
  - name: Yo-Chi
    website: https://yochi.com.au
    instagram_handle: iloveyochi
    has_loyalty_app: true
    melbourne_locations: null
    posts_promos: both
    promo_url: https://yochi.com.au/chi-club/
    footprint: national
    footprint_basis: >-
      Wikipedia records a 70th store nationally (Mar 2026) with no per-city
      breakdown, so this account speaks for stores well outside Melbourne.
    notes: >-
      Chi Club T&Cs explicitly require downloading the Yo-Chi app to register a
      membership, so this is a true app, not just a card. Melbourne count left
      null: the VIC venues page only returned Balaclava, Carlton, Hawthorn,
      Malvern, Windsor and Brighton on fetch, but Chadstone (Market Pavilion) is
      separately confirmed via the centre directory and a new "Fish Market"
      venue was announced on the brand's Facebook, so the page is clearly
      incomplete. At least 7 Melbourne venues confirmed. Wikipedia records a
      70th store nationally in March 2026 with no per-city breakdown.

